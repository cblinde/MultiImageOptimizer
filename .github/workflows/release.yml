name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.0); created from the selected ref if it does not exist"
        required: true
        type: string

permissions:
  contents: write

# One release at a time: a queued push re-reads the tags and does nothing if the
# previous run already published the same APP_VERSION.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Decide whether this run publishes. A push to main releases only when
  # APP_VERSION has no tag yet; tag pushes and manual runs always release.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      tag: ${{ steps.decide.outputs.tag }}
      build_ref: ${{ steps.decide.outputs.build_ref }}
    steps:
      # Tags are needed to resolve the commit of an existing tag for a manual
      # retry; the selected ref alone may be a newer branch head.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          build_ref="$GITHUB_SHA"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            version=$(python3 .github/scripts/check_release_version.py --print-version)
            tag="v$version"
            # Only a push that actually changed APP_VERSION is a release
            # candidate; compare with the branch head before this push.
            version_changed=true
            if [ -n "$BEFORE_SHA" ] &&
                [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
                git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              previous_main="$RUNNER_TEMP/previous-main.py"
              if git show "$BEFORE_SHA:src/main.py" > "$previous_main" 2>/dev/null; then
                previous_version=$(python3 .github/scripts/check_release_version.py \
                  --print-version "$previous_main" || true)
                if [ "$previous_version" = "$version" ]; then
                  version_changed=false
                fi
              fi
            fi
            if [ "$version_changed" = false ]; then
              echo "APP_VERSION is still $version; nothing to release."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "build_ref=$build_ref" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
              echo "$tag already exists; nothing to release."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "build_ref=$build_ref" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # A retry for an existing tag builds the tag's commit, not the branch
          # the manual run happened to be started from.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] &&
              git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            build_ref=$(git rev-parse "refs/tags/$tag^{commit}")
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build_ref=$build_ref" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag at $build_ref."

  # Same reusable build as push/PR: the exe that ships is the one built and
  # tested by the exact workflow that runs on main. It only starts once
  # prepare says there is something to publish.
  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.build_ref }}

  # Publish the executable together with its licences. Build and publish stay
  # in this run because a tag created with GITHUB_TOKEN would not trigger a
  # second workflow.
  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # Checkout first: its default clean would remove downloaded artifacts, and
      # the release needs the tracked LICENSE and THIRD_PARTY_NOTICES.md. Check
      # out the commit that was built, not the branch the run was started from.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.build_ref }}
          fetch-depth: 0
          fetch-tags: true

      # Publishing an exe that reports a different version than its tag is
      # unrecoverable once the asset is public, so check before uploading.
      - name: Check tag matches APP_VERSION
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/check_release_version.py "$RELEASE_TAG"

      # On workflow_dispatch the tag may already exist on another commit. The
      # assets built here come from this commit, so refuse to attach them to a
      # tag (and release history) that points somewhere else.
      - name: Check an existing tag points at this commit
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          head_commit=$(git rev-parse HEAD)
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" > /dev/null; then
            tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            if [ "$tag_commit" != "$head_commit" ]; then
              echo "::error::Tag $RELEASE_TAG points at $tag_commit, but this run builds $head_commit."
              exit 1
            fi
            echo "Tag $RELEASE_TAG already points at $head_commit."
          else
            echo "Tag $RELEASE_TAG does not exist yet; it will be created at $head_commit."
          fi

      # The Windows exe is built on a runner; this kit lets anyone rebuild it
      # locally with one double-click. CI runs the same script and executes the
      # extracted kit on Windows before a release can get here.
      - name: Build local Windows build kit
        run: python3 .github/scripts/make_build_kit.py

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          set -euo pipefail
          cp artifacts/windows-x64/MultiImageOptimizer.exe MultiImageOptimizer.exe
          mkdir -p stage/MultiImageOptimizer-windows-x64
          cp MultiImageOptimizer.exe LICENSE THIRD_PARTY_NOTICES.md stage/MultiImageOptimizer-windows-x64/
          ( cd stage && zip -qr ../MultiImageOptimizer-windows-x64.zip MultiImageOptimizer-windows-x64 )
          sha256sum MultiImageOptimizer.exe MultiImageOptimizer-windows-x64.zip \
            MultiImageOptimizer-build-kit.zip LICENSE THIRD_PARTY_NOTICES.md > SHA256SUMS

      # Upload into a draft first: if any asset upload fails, no public release
      # with a partial asset set exists. The next step publishes it.
      - id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.build_ref }}
          name: Multi-Image Optimizer ${{ needs.prepare.outputs.tag }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            MultiImageOptimizer.exe
            MultiImageOptimizer-windows-x64.zip
            MultiImageOptimizer-build-kit.zip
            LICENSE
            THIRD_PARTY_NOTICES.md
            SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PATCH \
            "repos/${{ github.repository }}/releases/${{ steps.release.outputs.id }}" \
            -F draft=false
