name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.0); created from the selected ref if it does not exist"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Same reusable build as push/PR: the exe that ships is the one built and
  # tested by the exact workflow that runs on main.
  build:
    uses: ./.github/workflows/build.yml

  # Publish the executable together with its licences.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Checkout first: its default clean would remove downloaded artifacts, and
      # the release needs the tracked LICENSE and THIRD_PARTY_NOTICES.md.
      - uses: actions/checkout@v4

      # Publishing an exe that reports a different version than its tag is
      # unrecoverable once the asset is public, so check before uploading.
      - name: Check tag matches APP_VERSION
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 .github/scripts/check_release_version.py "$RELEASE_TAG"

      # The Windows exe is built on a runner; this kit lets anyone rebuild it
      # locally with one double-click. CI runs the same script and executes the
      # extracted kit on Windows before a release can get here.
      - name: Build local Windows build kit
        run: python3 .github/scripts/make_build_kit.py

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          set -euo pipefail
          cp artifacts/windows-x64/MultiImageOptimizer.exe MultiImageOptimizer.exe
          mkdir -p stage/MultiImageOptimizer-windows-x64
          cp MultiImageOptimizer.exe LICENSE THIRD_PARTY_NOTICES.md stage/MultiImageOptimizer-windows-x64/
          ( cd stage && zip -qr ../MultiImageOptimizer-windows-x64.zip MultiImageOptimizer-windows-x64 )
          sha256sum MultiImageOptimizer.exe MultiImageOptimizer-windows-x64.zip \
            MultiImageOptimizer-build-kit.zip LICENSE THIRD_PARTY_NOTICES.md > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Multi-Image Optimizer ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            MultiImageOptimizer.exe
            MultiImageOptimizer-windows-x64.zip
            MultiImageOptimizer-build-kit.zip
            LICENSE
            THIRD_PARTY_NOTICES.md
            SHA256SUMS
