name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.0); created from the selected ref if it does not exist"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Compile and test once before anything is packaged.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # gui.py is not imported by the tests, so compile it explicitly.
      - name: Byte-compile sources
        run: python -m compileall -q aligner.py gui.py main.py pipeline.py rawio.py stacker.py tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

  # Build the standalone executable for each platform.
  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.3"

      - name: Build executable
        run: pyinstaller --noconfirm --clean build.spec

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/MultiImageOptimizer*
          if-no-files-found: error

  # Package both binaries and publish them as a GitHub Release.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release archives
        run: |
          set -euo pipefail
          mkdir -p release/MultiImageOptimizer-linux-x64 release/MultiImageOptimizer-windows-x64
          cp artifacts/linux-x64/MultiImageOptimizer release/MultiImageOptimizer-linux-x64/
          cp artifacts/windows-x64/MultiImageOptimizer.exe release/MultiImageOptimizer-windows-x64/
          cp README.md release/MultiImageOptimizer-linux-x64/
          cp README.md release/MultiImageOptimizer-windows-x64/
          ( cd release && tar -czf ../MultiImageOptimizer-linux-x64.tar.gz MultiImageOptimizer-linux-x64 )
          ( cd release && zip -qr ../MultiImageOptimizer-windows-x64.zip MultiImageOptimizer-windows-x64 )
          sha256sum MultiImageOptimizer-*.tar.gz MultiImageOptimizer-*.zip > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Multi-Image Optimizer ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            MultiImageOptimizer-*.tar.gz
            MultiImageOptimizer-*.zip
            SHA256SUMS
