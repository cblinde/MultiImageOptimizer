name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.0); created from the selected ref if it does not exist"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Identical to CI: the exe that ships is the one CI already built and tested.
  build:
    uses: ./.github/workflows/build.yml

  # Publish the executable itself as the release asset.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          set -euo pipefail
          cp artifacts/windows-x64/MultiImageOptimizer.exe MultiImageOptimizer.exe
          sha256sum MultiImageOptimizer.exe > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Multi-Image Optimizer ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            MultiImageOptimizer.exe
            SHA256SUMS
